<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minha coleção Mega Drive</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1f;--mu:#6b6b70;--bd:#e1dfd8;--ac:#1b5fd1;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141416;--card:#1e1e22;--tx:#f0f0f2;--mu:#9a9aa2;--bd:#32323a;--ac:#6ea2ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141416;--card:#1e1e22;--tx:#f0f0f2;--mu:#9a9aa2;--bd:#32323a;--ac:#6ea2ff;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1240px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:4px 0 2px}
.sub{color:var(--mu);font-size:13px;margin:0 0 12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font:inherit}
#q{flex:1;min-width:160px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;font-size:13px}
.stats span{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:3px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;align-items:start}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;display:flex;flex-direction:column;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card.st0{border-color:#3b82f6;box-shadow:0 0 0 1px rgba(59,130,246,.28),0 1px 3px rgba(0,0,0,.08)}
.card.st1{border-color:#e0a81c;box-shadow:0 0 0 1px rgba(224,168,28,.30),0 1px 3px rgba(0,0,0,.08)}
.card.st2{border-color:#2e9e5b;box-shadow:0 0 0 1px rgba(46,158,91,.30),0 1px 3px rgba(0,0,0,.08)}
.card.st3{border-color:#e5484d;box-shadow:0 0 0 1px rgba(229,72,77,.30),0 1px 3px rgba(0,0,0,.08)}
.top{position:relative}
.cb{position:absolute;left:8px;top:8px;z-index:3;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:16px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.cb:hover{background:rgba(0,0,0,.8)}
.cb.has{background:var(--ac);box-shadow:0 0 0 2px #fff}
.cmt{margin:8px 0 4px}
.ct{width:100%;resize:vertical;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font:inherit;font-size:13.5px;line-height:1.5}
.ct:focus{outline:2px solid var(--ac);outline-offset:0}
.cmh{display:flex;align-items:center;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--mu)}
.cmh .b{padding:4px 10px;font-size:12px}
.cmp{font-size:13px;font-style:italic;color:var(--mu);border-left:3px solid var(--ac);padding:2px 10px;margin:8px 0 4px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.sh{border-radius:13px 13px 0 0;position:relative;aspect-ratio:10/7;background:#111;cursor:pointer;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:13px;text-align:center;padding:10px}
.sh img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sh .dots{position:absolute;right:8px;top:8px;display:flex;gap:4px}
.sh .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45)}
.sh .dots i.on{background:#fff}
.cv{position:absolute;left:12px;bottom:-36px;z-index:2;width:78px;height:106px;border-radius:6px;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font-size:10px;font-weight:600;padding:4px;box-shadow:0 3px 10px rgba(0,0,0,.45);border:2px solid var(--card);transform-origin:left center;transition:transform .2s ease,box-shadow .2s ease}
@media (hover:hover){.card:hover{z-index:30}.cv:hover{transform:scale(3);box-shadow:0 10px 30px rgba(0,0,0,.55);z-index:40}}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hd{padding:8px 12px 0 104px;min-height:72px}
.n{font-weight:700;font-size:16px;line-height:1.25}
.gn{color:var(--mu);font-size:12px;margin-top:3px}
.bd{padding:6px 14px 14px}
.ch{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.ch span{font-size:12px;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:2px 9px;color:var(--mu)}
.t{font-size:13.5px;line-height:1.55;text-align:justify;hyphens:auto;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.t.open{-webkit-line-clamp:unset;display:block}
.more{font-size:12px;color:var(--ac);cursor:pointer;margin:4px 0 0;background:none;border:0;padding:0}
select.s{width:100%;margin-top:12px;font-size:13px}
.s[data-v="Terminado"]{border-color:#2e9e5b;color:#2e9e5b}
.s[data-v="Abandonado"]{border-color:#e5484d;color:#e5484d}
.s[data-v="Não terminado"]{border-color:#e0a81c;color:#c28a00}
.s[data-v="Não joguei"]{border-color:#3b82f6;color:#3b82f6}
button.b{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font:inherit;cursor:pointer}
button.b:hover{border-color:var(--ac);color:var(--ac)}
#msg{min-height:18px;color:var(--ac);margin:-4px 0 10px}
.emp{color:var(--mu);text-align:center;padding:30px;grid-column:1/-1}
</style>
</head>
<body>
<main>
<h1>Minha coleção Mega Drive</h1>
<p class="sub">As imagens vêm da mesma pasta deste arquivo. Toque na tela para ver outra imagem do jogo, na capa para trocá-la e no texto para ler a descrição completa. O status fica salvo neste navegador.</p>
<div class="stats" id="st"></div>
<div class="bar">
<input id="q" type="search" placeholder="Buscar jogo ou produtora…">
<select id="fc"></select>
<select id="fs"><option value="">Todos os status</option><option>Não joguei</option><option>Não terminado</option><option>Terminado</option><option>Abandonado</option></select>
<select id="so"><option value="0">Ordem da lista</option><option value="1">Nome</option><option value="2">Ano</option><option value="3">Tempo para zerar</option></select>
<button class="b" id="bk" type="button" title="Baixa um arquivo com seus status e capas trocadas">Salvar backup</button>
<button class="b" id="rs" type="button" title="Carrega um arquivo de backup salvo antes">Restaurar backup</button>
</div>
<div id="msg" class="sub" aria-live="polite"></div>
<div class="grid" id="ls"></div>
<input id="fi" type="file" accept="image/*" hidden>
<input id="bi" type="file" accept="application/json,.json" hidden>
</main>
<script>
var C={A:"Ação, aventura e beat ’em up",P:"Plataforma",R:"RPG, aventura e estratégia",L:"Luta",C:"Corrida",S:"Shoot ’em up",E:"Esportes, arcade e puzzle",V:"Combate aéreo",X:"Aventura e exploração"};
var D=[{"n":"Alisia Dragoon","c":"A","d":"Game Arts / Sega","y":1992,"h":1.5,"f":"Alisia Dragoon (USA).cover.png","t":"Alisia Dragoon é um jogo de ação e plataforma desenvolvido pela Game Arts, estúdio conhecido por séries como Lunar e Grandia, e publicado pela Sega em 1992 para o Mega Drive. Você controla Alisia, uma guerreira capaz de invocar raios que atingem os inimigos na tela, na luta contra o exército do vilão Baldour. Ela é acompanhada por criaturas aliadas, que atacam ao lado dela e podem ser alternadas conforme a situação. A força do raio é limitada por uma barra de energia, o que obriga o jogador a dosar os ataques. O jogo se destaca pelo visual bem detalhado e pela trilha sonora marcante.","s":["Alisia Dragoon (USA).shot.1.png","Alisia Dragoon (USA).shot.2.png"]},{"n":"Alien Soldier","c":"A","d":"Treasure","y":1995,"h":1.5,"f":"Alien Soldier (Europe).cover.png","t":"Alien Soldier é um jogo de ação do estilo run and gun desenvolvido pela Treasure, a mesma equipe de Gunstar Heroes, e publicado pela Sega em 1995 para o Mega Drive. Você controla Epsilon-Eagle, um soldado cibernético que enfrenta uma sequência quase ininterrupta de chefes, muitos deles ocupando boa parte das fases. O jogador monta seu arsenal escolhendo entre vários tipos de arma e pode se teletransportar para escapar de ataques. A dificuldade é alta e exige memorizar padrões. Entre os destaques estão a velocidade da ação, o visual cheio de efeitos e a trilha intensa, que o transformaram em um título cultuado.","s":["Alien Soldier (Europe).shot.1.png","Alien Soldier (Europe).shot.2.png"]},{"n":"Another World","c":"A","d":"Delphine Software","y":1992,"h":2.0,"f":"Another World (Europe).cover.png","t":"Another World é um jogo de aventura cinematográfica criado por Éric Chahi, desenvolvido pela Delphine Software e lançado originalmente em 1991 para computadores, com versão para o Mega Drive em 1992. O jogo acompanha o físico Lester Chaykin, que durante um experimento é transportado para um planeta alienígena hostil. Sem textos explicativos nem painel na tela, o jogador resolve enigmas, foge de criaturas e encontra um aliado misterioso. Os gráficos usam polígonos vetoriais e animações rotoscopadas, o que dá ao jogo um estilo único e narrativa totalmente visual. É considerado um marco do gênero cinematográfico.","s":["Another World (Europe).shot.1.png","Another World (Europe).shot.2.png"]},{"n":"Batman: The Video Game","c":"A","d":"Sunsoft","y":1990,"h":1.5,"f":"Batman (USA).cover.png","t":"Batman: The Video Game é um jogo de ação e plataforma desenvolvido e publicado pela Sunsoft e lançado em 1990 para o Mega Drive, inspirado no filme de 1989 dirigido por Tim Burton. A história leva o Homem-Morcego a combater o Coringa e seus capangas por cenários como a fábrica de produtos químicos Axis e as ruas de Gotham City. O jogador usa socos, um gancho e outros equipamentos para enfrentar os inimigos e superar obstáculos. Há também fases de ação em veículos, que quebram o ritmo da jornada. A versão do Mega Drive é diferente da lançada para outros consoles da Sunsoft.","s":["Batman (USA).shot.1.png","Batman (USA).shot.2.png"]},{"n":"Blades of Vengeance","c":"A","d":"Beam Software / EA","y":1993,"h":3.0,"f":"Blades of Vengeance (USA, Europe).cover.png","t":"Blades of Vengeance é um jogo de ação com elementos de beat ’em up e hack and slash, desenvolvido pela Beam Software e publicado pela Electronic Arts em 1993 para o Mega Drive. O jogador escolhe um entre três heróis, cada um com características próprias, para avançar por cenários de fantasia sombria enfrentando criaturas e chefes. Os personagens executam combinações de golpes e podem usar magias, e a progressão é lateral. O jogo é pouco conhecido, mas chama atenção pela ambientação sombria e pelo grande número de inimigos diferentes.","s":["Blades of Vengeance (USA, Europe).shot.1.png","Blades of Vengeance (USA, Europe).shot.2.png"]},{"n":"Bonanza Bros.","c":"A","d":"Sega","y":1991,"h":1.0,"f":"Bonanza Bros. (USA, Korea).cover.png","t":"Bonanza Bros. é um jogo de ação e furtividade desenvolvido e publicado pela Sega, lançado em 1991 para o Mega Drive como adaptação do fliperama de 1990. Você controla os ladrões Robo e Mobo, que invadem prédios para roubar tesouros e escapar de seguranças. As fases são compostas por vários andares e é possível se esconder, atordoar guardas com disparos e coletar itens espalhados. O jogo permite dois jogadores simultâneos com a tela dividida e se destaca pelo visual cômico e pela mistura de ação e infiltração.","s":["Bonanza Bros. (USA, Korea).shot.1.png","Bonanza Bros. (USA, Korea).shot.2.png"]},{"n":"Captain America and the Avengers","c":"A","d":"Data East","y":1992,"h":1.0,"f":"Captain America and the Avengers (USA).cover.png","t":"Captain America and the Avengers é um beat ’em up desenvolvido e publicado pela Data East, lançado em 1992 para o Mega Drive, a partir do fliperama de 1991. O jogador controla Capitão América, Homem de Ferro, Visão ou Gavião Arqueiro, em uma aventura contra o Caveira Vermelha e outros vilões da Marvel. Cada herói tem ataques e habilidades distintos, e a progressão lateral é interrompida por chefes ao fim das fases. O jogo oferece cooperativo para dois jogadores e fases com perspectivas variadas, incluindo trechos em que o herói voa.","s":["Captain America and the Avengers (USA).shot.1.png","Captain America and the Avengers (USA).shot.2.png"]},{"n":"Castlevania: Bloodlines","c":"A","d":"Konami","y":1994,"h":1.5,"f":"Castlevania - Bloodlines (USA).cover.png","t":"Castlevania: Bloodlines é um jogo de ação e plataforma desenvolvido e publicado pela Konami em 1994 para o Mega Drive, único título da série lançado em um console da Sega. A trama se passa em 1917, durante a Primeira Guerra Mundial, quando Elizabeth Bartley, sobrinha de Drácula, tenta ressuscitar o vampiro. Os caçadores John Morris e Eric Lecarde viajam por vários países da Europa para impedir o plano. John usa o chicote Vampire Killer e Eric luta com uma lança, que permite golpes verticais. O jogo se destaca pela atmosfera sombria, pelos efeitos gráficos e pela trilha sonora.","s":["Castlevania - Bloodlines (USA).shot.1.png","Castlevania - Bloodlines (USA).shot.2.png"]},{"n":"Comix Zone","c":"A","d":"Sega Technical Institute","y":1995,"h":1.0,"f":"Comix Zone (USA).cover.png","t":"Comix Zone é um jogo de ação e luta de rolagem lateral desenvolvido pela Sega Technical Institute e publicado pela Sega em 1995 para o Mega Drive. Você controla Sketch Turner, artista e roqueiro que fica preso dentro da história em quadrinhos que estava criando, onde o vilão Mortus desenha inimigos para derrotá-lo. As fases se passam em painéis de HQ, e o jogador pode quebrar paredes, interagir com o cenário e usar itens, como o rato Roadkill. A apresentação traz balões de fala, onomatopeias e efeitos inspirados em quadrinhos, o que dá identidade visual marcante.","s":["Comix Zone (USA).shot.1.png","Comix Zone (USA).shot.2.png"]},{"n":"Contra: Hard Corps","c":"A","d":"Konami","y":1994,"h":1.0,"f":"Contra - Hard Corps (USA, Korea).cover.png","t":"Contra: Hard Corps é um jogo de ação run and gun desenvolvido e publicado pela Konami em 1994 para o Mega Drive, lançado como Probotector na Europa. Quatro personagens são jogáveis, cada um com armas e características próprias, e a história pode seguir caminhos diferentes, levando a múltiplos finais. Ao contrário dos jogos anteriores da série, o herói suporta alguns golpes antes de perder uma vida. A dificuldade é elevada, com chefes enormes e cenas de ação muito intensas. O jogo tem cooperativo para dois jogadores e é uma das entradas mais admiradas da série.","s":["Contra - Hard Corps (USA, Korea).shot.1.png","Contra - Hard Corps (USA, Korea).shot.2.png"]},{"n":"Decap Attack","c":"A","d":"Vic Tokai","y":1991,"h":1.5,"f":"DEcapAttack (USA, Europe).cover.png","t":"Decap Attack é um jogo de plataforma publicado pela Vic Tokai em 1991 para o Mega Drive, adaptação ocidental de um jogo japonês da própria empresa. Você controla Chuck D. Head, uma múmia sem cabeça que ataca os inimigos com um soco e arremessando o crânio que carrega no peito. Os cenários têm tema de terror cômico, com monstros e chefes estranhos. O jogo se destaca pelo humor, pelas cores fortes e pelos poderes variados que a cabeça de Chuck pode assumir ao longo das fases.","s":[]},{"n":"ESWAT: City Under Siege","c":"A","d":"Sega","y":1990,"h":1.5,"f":"ESWAT - City Under Siege (USA, Europe).cover.png","t":"ESWAT: City Under Siege é um jogo de ação de rolagem lateral desenvolvido e publicado pela Sega em 1990 para o Mega Drive, baseado no fliperama ESWAT: Cyber Police. O jogador controla um policial de armadura tecnológica que combate criminosos e organizações perigosas por uma cidade futurista. Entre as fases é possível comprar melhorias para a armadura e armas, aumentando o poder do personagem. O jogo é conhecido pela trilha sonora marcante e pelas mudanças em relação à versão de arcade.","s":["ESWAT - City Under Siege (USA, Europe).shot.1.png","ESWAT - City Under Siege (USA, Europe).shot.2.png"]},{"n":"Golden Axe","c":"A","d":"Sega","y":1989,"h":0.7,"f":"Golden Axe (World).cover.png","t":"Golden Axe é um beat ’em up de fantasia desenvolvido e publicado pela Sega, lançado em 1989 para o Mega Drive a partir do fliperama da mesma empresa. O jogador escolhe entre o anão Gilius Thunderhead, a amazona Tyris Flare e o bárbaro Ax Battler, que lutam contra o tirano Death Adder, responsável por sequestrar o rei e a princesa. Os personagens usam golpes físicos, magias e podem montar criaturas, os chamados bizarrians. O jogo tem cooperativo para dois jogadores e modo extra Duel, e popularizou o estilo de fantasia no gênero.","s":["Golden Axe (World).shot.1.png","Golden Axe (World).shot.2.png"]},{"n":"Golden Axe II","c":"A","d":"Sega","y":1991,"h":0.7,"f":"Golden Axe II (World).cover.png","t":"Golden Axe II é um beat ’em up de fantasia desenvolvido e publicado pela Sega em 1991 para o Mega Drive. Os heróis Ax Battler, Tyris Flare e Gilius Thunderhead retornam para recuperar o machado dourado, roubado pelo vilão Dark Guld. O jogador avança por cenários variados, enfrentando soldados, criaturas e chefes, e pode usar magias coletadas durante a jornada. A mecânica é parecida com a do primeiro jogo, mas há novos golpes, cenários e inimigos. O modo cooperativo para dois jogadores manteve a popularidade da série.","s":["Golden Axe II (World).shot.1.png","Golden Axe II (World).shot.2.png"]},{"n":"Gunstar Heroes","c":"A","d":"Treasure","y":1993,"h":1.5,"f":"Gunstar Heroes (USA).cover.png","t":"Gunstar Heroes é um jogo de ação run and gun desenvolvido pela Treasure e publicado pela Sega em 1993 para o Mega Drive, a estreia do estúdio fundado por ex-integrantes da Konami. Você controla Gunstar Red ou Gunstar Blue, que combatem o exército do Império do Coronel Red para impedir o uso de gemas mágicas. É possível combinar dois tipos de armas, gerando efeitos diferentes, e também agarrar e arremessar inimigos. As fases variam bastante, incluindo corrida em carrinho e batalhas contra chefes enormes. O jogo tem cooperativo para dois jogadores e é um dos títulos mais elogiados do console.","s":["Gunstar Heroes (USA).shot.1.png","Gunstar Heroes (USA).shot.2.png"]},{"n":"Midnight Resistance","c":"A","d":"Data East","y":1990,"h":1.0,"f":"Midnight Resistance (USA).cover.png","t":"Midnight Resistance é um jogo de ação run and gun publicado pela Data East em 1990 para o Mega Drive, adaptação do fliperama de 1989. O jogador assume o papel de um soldado que precisa resgatar a família sequestrada pelo vilão King Crimson. Ao derrotar inimigos específicos, ele coleta chaves que liberam armas melhores nas caixas de armamento, permitindo montar um arsenal. O jogo permite dois jogadores simultâneos e se destaca pela ação constante e pelo visual sombrio.","s":["Midnight Resistance (USA).shot.1.png","Midnight Resistance (USA).shot.2.png"]},{"n":"Mystical Fighter","c":"A","d":"Taito","y":1990,"h":1.0,"f":"Mystical Fighter (USA).cover.png","t":"Mystical Fighter é um jogo de ação de rolagem lateral publicado pela Taito em 1990 para o Mega Drive. O jogador controla um guerreiro mágico que combate monstros e criaturas inspiradas em mitologias, avançando por fases curtas que terminam em chefes. O personagem executa golpes corpo a corpo e usa habilidades especiais para superar os inimigos. É um título pouco conhecido do console, que se destaca pelo estilo arcade e pelo visual repleto de criaturas bizarras.","s":["Mystical Fighter (USA).shot.1.png","Mystical Fighter (USA).shot.2.png"]},{"n":"Rocket Knight Adventures","c":"A","d":"Konami","y":1993,"h":1.5,"f":"Rocket Knight Adventures (USA).cover.png","t":"Rocket Knight Adventures é um jogo de ação e plataforma desenvolvido e publicado pela Konami em 1993 para o Mega Drive. Você controla Sparkster, um gambá-cavaleiro que defende o Reino de Zebulos do exército de porcos e do rival Axel Gear. Ele luta com uma espada e usa um jetpack para dar saltos impulsionados e investidas em linha reta. As fases alternam plataforma, trechos de voo e batalhas contra chefes, com visual colorido e animações suaves. O jogo é elogiado pelo ritmo ágil e pela trilha sonora, e deu origem a uma série.","s":["Rocket Knight Adventures (USA).shot.1.png","Rocket Knight Adventures (USA).shot.2.png"]},{"n":"Shadow Dancer: The Secret of Shinobi","c":"A","d":"Sega","y":1990,"h":1.0,"f":"Shadow Dancer - The Secret of Shinobi (World).cover.png","t":"Shadow Dancer: The Secret of Shinobi é um jogo de ação e plataforma desenvolvido e publicado pela Sega em 1990 para o Mega Drive, baseado no fliperama de 1989. Você controla Joe Musashi, que retorna acompanhado de um cão ninja para enfrentar a organização terrorista Union Lizard. O cão pode atacar inimigos e atordoá-los, e o ninja usa shurikens, golpes corpo a corpo e magias ninja. As fases têm múltiplos andares e a ação é rápida. O jogo é lembrado pelo cenário diverso e pelo estilo marcante da série Shinobi.","s":["Shadow Dancer - The Secret of Shinobi (World).shot.1.png","Shadow Dancer - The Secret of Shinobi (World).shot.2.png"]},{"n":"Shadow of the Beast","c":"A","d":"Reflections / Psygnosis","y":1991,"h":1.5,"f":"Shadow of the Beast (USA, Europe).cover.png","t":"Shadow of the Beast é um jogo de ação e aventura desenvolvido pela Reflections e lançado originalmente para o Amiga em 1989 pela Psygnosis, com versão para o Mega Drive em 1991. A história acompanha Aarbron, que foi sequestrado na infância e transformado em uma criatura selvagem a serviço do mago Maletoth, e busca vingança. O jogador atravessa cenários extensos enfrentando monstros, com combate simples e um alto nível de dificuldade. Na época, impressionou pela rolagem em várias camadas e pelo visual detalhado, além de uma trilha sonora atmosférica.","s":["Shadow of the Beast (USA, Europe).shot.1.png","Shadow of the Beast (USA, Europe).shot.2.png"]},{"n":"Shinobi III: Return of the Ninja Master","c":"A","d":"Sega","y":1993,"h":1.5,"f":"Shinobi III - Return of the Ninja Master (USA).cover.png","t":"Shinobi III: Return of the Ninja Master é um jogo de ação e plataforma desenvolvido e publicado pela Sega em 1993 para o Mega Drive. Joe Musashi enfrenta de novo a organização Neo Zeed, agora liderada por um vilão que ressurge. O ninja ganhou habilidades novas, como correr, saltar duas vezes e se agarrar a paredes, além de magias ninja. As fases incluem trechos memoráveis, como a cavalgada e o surfe. A ação é muito veloz e o jogo é considerado por muitos o melhor da série.","s":["Shinobi III - Return of the Ninja Master (USA).shot.1.png","Shinobi III - Return of the Ninja Master (USA).shot.2.png"]},{"n":"Splatterhouse 2","c":"A","d":"Namco","y":1992,"h":1.5,"f":"Splatterhouse 2 (USA).cover.png","t":"Splatterhouse 2 é um beat ’em up de terror desenvolvido e publicado pela Namco em 1992 para o Mega Drive. Você controla Rick Taylor, que usa a máscara sobrenatural Terror Mask para enfrentar monstros e salvar a namorada Jennifer. O jogador avança por cenários sombrios, usando socos, chutes e armas improvisadas, enquanto lida com uma violência mais gráfica que a de outros jogos do console. A atmosfera macabra e o visual grotesco são os principais destaques, e o jogo continua sendo referência do gênero terror.","s":["Splatterhouse 2 (USA).shot.1.png","Splatterhouse 2 (USA).shot.2.png"]},{"n":"Splatterhouse 3","c":"A","d":"Namco","y":1993,"h":2.0,"f":"Splatterhouse 3 (USA).cover.png","t":"Splatterhouse 3 é um jogo de ação de terror desenvolvido e publicado pela Namco em 1993 para o Mega Drive. Rick Taylor precisa proteger a esposa Jennifer e o filho David de forças sobrenaturais que cercam sua mansão. As fases são mais abertas, com vários caminhos e limite de tempo, e o final varia de acordo com o desempenho do jogador. Rick pode se transformar em criatura monstruosa para aumentar sua força. É diferente dos anteriores por misturar combate e exploração, e se destaca pela ambientação e pela sensação de urgência.","s":["Splatterhouse 3 (USA).shot.1.png","Splatterhouse 3 (USA).shot.2.png"]},{"n":"Streets of Rage","c":"A","d":"Sega","y":1991,"h":1.0,"f":"Streets of Rage (World).cover.png","t":"Streets of Rage é um jogo de ação do gênero beat ’em up, desenvolvido e publicado pela Sega em 1991 para o Mega Drive. A trama se passa em uma cidade dominada pelo crime organizado, onde três ex-policiais, Axel, Blaze e Adam, enfrentam uma organização criminosa liderada por Mr. X. O jogador avança por cenários urbanos usando socos, chutes, combinações de golpes e ataques especiais, além de armas e itens de recuperação de energia encontrados pelo caminho. O jogo tem progressão lateral, chefes ao final das fases e modo cooperativo para dois jogadores. A trilha sonora eletrônica de Yuzo Koshiro e Motohiro Kawashima se tornou uma de suas marcas.","s":["Streets of Rage (World).shot.1.png","Streets of Rage (World).shot.2.png"]},{"n":"Streets of Rage 2","c":"A","d":"Sega","y":1992,"h":1.5,"f":"Streets of Rage 2 (USA).cover.png","t":"Streets of Rage 2 é um beat ’em up desenvolvido pela Sega em parceria com a Ancient e publicado em 1992 para o Mega Drive. Um ano depois dos eventos do primeiro jogo, Mr. X retorna e sequestra Adam, e Axel, Blaze, Max e o jovem Skate partem para enfrentá-lo. Cada personagem tem golpes e atributos próprios, incluindo agarrões e ataques especiais. Os cenários são maiores e os chefes mais variados. A trilha eletrônica de Yuzo Koshiro e Motohiro Kawashima é considerada uma das melhores da era, e o jogo é visto como referência do gênero.","s":["Streets of Rage 2 (USA).shot.1.png","Streets of Rage 2 (USA).shot.2.png"]},{"n":"Streets of Rage 3","c":"A","d":"Sega","y":1994,"h":2.0,"f":"Streets of Rage 3 (USA).cover.png","t":"Streets of Rage 3 é um beat ’em up publicado pela Sega em 1994 para o Mega Drive. Desta vez, o vilão Mr. X pretende substituir figuras importantes da cidade por robôs, e Axel, Blaze, Skate e o cientista Dr. Zan se unem para impedi-lo. O jogo traz golpes mais rápidos, corrida, uma barra de ataque especial e finais alternativos conforme as escolhas feitas. A trilha sonora tem um estilo bem mais experimental, em técnicas eletrônicas inovadoras. É o episódio mais complexo e desafiador da trilogia.","s":["Streets of Rage 3 (USA).shot.1.png","Streets of Rage 3 (USA).shot.2.png"]},{"n":"Strider","c":"A","d":"Capcom / Sega","y":1990,"h":1.0,"f":"Strider (USA, Europe).cover.png","t":"Strider é um jogo de ação e plataforma publicado pela Sega em 1990 para o Mega Drive, adaptação do fliperama da Capcom lançado em 1989. Você controla Strider Hiryu, o mais jovem agente da organização de elite Strider, que viaja ao futuro para combater o governante Grandmaster Meio. Hiryu usa uma lâmina plasmática, o Cypher, e é capaz de escalar paredes e tetos. O jogo é veloz e acrobático, com fases em cenários futuristas, e se destaca pelos chefes e pelo estilo visual dinâmico.","s":["Strider (USA, Europe).shot.1.png","Strider (USA, Europe).shot.2.png"]},{"n":"Sunset Riders","c":"A","d":"Konami","y":1993,"h":0.7,"f":"Sunset Riders (USA).cover.png","t":"Sunset Riders é um jogo de ação com tiros publicado pela Konami em 1993 para o Mega Drive, baseado no fliperama de 1991. Você assume o papel de caçadores de recompensa no Velho Oeste, que perseguem bandidos pelos cenários enfrentando chefes de gangues. A ação é lateral, com tiroteios rápidos, saltos e esquivas. O jogo tem cooperativo para dois jogadores e se destaca pelo humor, pelas cores fortes e pela trilha sonora de estilo faroeste.","s":["Sunset Riders (USA).shot.1.png","Sunset Riders (USA).shot.2.png"]},{"n":"The Revenge of Shinobi","c":"A","d":"Sega","y":1989,"h":2.0,"f":"Revenge of Shinobi, The (USA, Europe).cover.png","t":"The Revenge of Shinobi é um jogo de ação e plataforma desenvolvido e publicado pela Sega em 1989 para o Mega Drive. Joe Musashi parte em busca de vingança contra a organização Neo Zeed, que assassinou seu mestre e sequestrou sua noiva. O ninja usa shurikens, golpes de espada e quatro magias ninja que alteram o combate. As fases têm cenários variados e chefes marcantes. A trilha de Yuzo Koshiro é um dos grandes destaques, e as primeiras versões trouxeram personagens de outras franquias como inimigos, removidos depois.","s":["Revenge of Shinobi, The (USA, Europe).shot.1.png","Revenge of Shinobi, The (USA, Europe).shot.2.png"]},{"n":"Teenage Mutant Ninja Turtles: The Hyperstone Heist","c":"A","d":"Konami","y":1992,"h":1.0,"f":"Teenage Mutant Ninja Turtles - The Hyperstone Heist (USA).cover.png","t":"Teenage Mutant Ninja Turtles: The Hyperstone Heist é um beat ’em up desenvolvido e publicado pela Konami em 1992 para o Mega Drive, baseado nos fliperamas da franquia. Leonardo, Donatello, Michelangelo e Raphael enfrentam Shredder, Krang e seus capangas, incluindo Bebop e Rocksteady. As fases misturam trechos dos arcades anteriores com cenários e chefes novos. O jogo tem cooperativo para dois jogadores e se destaca pela fidelidade ao desenho animado e pelo ritmo de ação.","s":["Teenage Mutant Ninja Turtles - The Hyperstone Heist (USA).shot.1.png","Teenage Mutant Ninja Turtles - The Hyperstone Heist (USA).shot.2.png"]},{"n":"X-Men 2: Clone Wars","c":"A","d":"Headgames / Sega","y":1995,"h":2.0,"f":"X-Men 2 - Clone Wars (USA, Europe).cover.png","t":"X-Men 2: Clone Wars é um jogo de ação lateral desenvolvido pela Headgames e publicado pela Sega em 1995 para o Mega Drive. Você escolhe entre mutantes como Wolverine, Cyclops e Magneto para enfrentar o vilão Apocalipse e seus clones. Cada personagem tem poderes próprios e golpes especiais, e o jogador pode alternar de herói em determinados momentos. Os cenários são ligados à história dos quadrinhos, com chefes baseados em personagens conhecidos. É uma continuação de X-Men, também do Mega Drive.","s":["X-Men 2 - Clone Wars (USA, Europe).shot.1.png","X-Men 2 - Clone Wars (USA, Europe).shot.2.png"]},{"n":"Aladdin","c":"P","d":"Virgin Games","y":1993,"h":2.0,"f":"Aladdin (USA).cover.png","t":"Aladdin é um jogo de plataforma desenvolvido pela Virgin Games e publicado em 1993 para o Mega Drive, baseado no filme da Disney. O projeto teve a participação do programador David Perry e a colaboração de animadores da Disney, o que rendeu animações fluidas. Aladdin usa uma cimitarra para enfrentar inimigos e arremessa maçãs, enquanto salta e escala por cenários como mercados e a Caverna das Maravilhas. As fases seguem os momentos do filme, com direito a voo de tapete mágico e chefes. Foi um dos jogos de maior sucesso do console.","s":["Aladdin (USA).shot.1.png","Aladdin (USA).shot.2.png"]},{"n":"Castle of Illusion Starring Mickey Mouse","c":"P","d":"Sega","y":1990,"h":1.5,"f":"Castle of Illusion Starring Mickey Mouse (USA, Europe).cover.png","t":"Castle of Illusion Starring Mickey Mouse é um jogo de plataforma desenvolvido e publicado pela Sega em 1990 para o Mega Drive. A bruxa Mizrabel sequestra Minnie para roubar sua beleza, e Mickey enfrenta o castelo dela para resgatá-la, reunindo as Sete Gemas do Arco-Íris. O jogador ataca pulando sobre os inimigos e arremessando objetos, atravessando fases como a Floresta Encantada, a Biblioteca e o Castelo. O visual detalhado e a jogabilidade precisa fizeram dele um dos jogos de plataforma mais apreciados do console.","s":["Castle of Illusion Starring Mickey Mouse (USA, Europe).shot.1.png","Castle of Illusion Starring Mickey Mouse (USA, Europe).shot.2.png"]},{"n":"Dynamite Headdy","c":"P","d":"Treasure","y":1994,"h":2.0,"f":"Dynamite Headdy (USA, Europe).cover.png","t":"Dynamite Headdy é um jogo de plataforma e ação desenvolvido pela Treasure e publicado pela Sega em 1994 para o Mega Drive. O herói é Headdy, um boneco que usa a própria cabeça como arma e pode trocá-la por versões com poderes diferentes. A história acontece em um grande teatro, com fases que lembram atos de um espetáculo, e o vilão é o Rei Demônio das Trevas. O jogo se destaca pelos chefes gigantes, pelo humor e pela criatividade dos cenários.","s":["Dynamite Headdy (USA, Europe).shot.1.png","Dynamite Headdy (USA, Europe).shot.2.png"]},{"n":"Earthworm Jim","c":"P","d":"Shiny Entertainment","y":1994,"h":2.5,"f":"Earthworm Jim (USA).cover.png","t":"Earthworm Jim é um jogo de plataforma e ação desenvolvido pela Shiny Entertainment e publicado pela Playmates Interactive em 1994 para o Mega Drive. Criado por Doug TenNapel, o jogo acompanha uma minhoca que vira herói ao vestir um supertraje espacial, e precisa resgatar a Princesa Qualquer-Nome enfrentando vilões como Psy-Crow e a Rainha Lesma-de-Bunda. Jim usa um canhão de plasma e o próprio corpo como chicote. O humor absurdo, as animações caprichadas e a trilha de Tommy Tallarico fazem dele um clássico.","s":["Earthworm Jim (USA).shot.1.png","Earthworm Jim (USA).shot.2.png"]},{"n":"Earthworm Jim 2","c":"P","d":"Shiny Entertainment","y":1995,"h":2.5,"f":"Earthworm Jim 2 (USA).cover.png","t":"Earthworm Jim 2 é um jogo de plataforma e ação desenvolvido pela Shiny Entertainment e publicado pela Playmates Interactive em 1995 para o Mega Drive. Jim retorna ao universo cômico do primeiro jogo para salvar novamente a Princesa Qualquer-Nome, enfrentando Psy-Crow e a Rainha Lesma-de-Bunda. A sequência traz fases mais variadas, novas armas e momentos inusitados, como voar em um foguete e uma corrida de porcos. Mantém o humor anárquico, o visual cheio de detalhes e animações muito expressivas.","s":["Earthworm Jim 2 (USA).shot.1.png","Earthworm Jim 2 (USA).shot.2.png"]},{"n":"Flashback","c":"P","d":"Delphine Software","y":1993,"h":3.5,"f":"Flashback - The Quest for Identity (USA).cover.png","t":"Flashback é um jogo de aventura cinematográfica desenvolvido pela Delphine Software, com criação de Paul Cuisset, e lançado em 1993 para o Mega Drive pela U.S. Gold. O jogador controla Conrad B. Hart, que acorda sem memória em uma selva e descobre uma conspiração alienígena contra a Terra. A jogabilidade mistura plataforma, exploração e quebra-cabeças, com animações feitas por rotoscopia, que dão movimentos realistas ao personagem. Sua atmosfera de ficção científica e a narrativa sem diálogos longos o tornaram um clássico do gênero.","s":["Flashback - The Quest for Identity (USA).shot.1.png","Flashback - The Quest for Identity (USA).shot.2.png"]},{"n":"Garfield: Caught in the Act","c":"P","d":"Dark Technologies","y":1995,"h":1.5,"f":"Garfield - Caught in the Act (USA, Europe).cover.png","t":"Garfield: Caught in the Act é um jogo de plataforma desenvolvido pela Dark Technologies e publicado pela Sega em 1995 para o Mega Drive, baseado no personagem criado por Jim Davis. Garfield acaba dentro da televisão e precisa atravessar mundos inspirados em gêneros de programas para voltar para casa. Ele ataca arranhando e usa itens espalhados pelas fases, em cenários cheios de piadas visuais e referências à cultura pop. O jogo se destaca pelo humor e pelas animações do gato.","s":["Garfield - Caught in the Act (USA, Europe).shot.1.png","Garfield - Caught in the Act (USA, Europe).shot.2.png"]},{"n":"Gargoyles","c":"P","d":"Buena Vista Interactive","y":1995,"h":2.0,"f":"Gargoyles (USA).cover.png","t":"Gargoyles é um jogo de plataforma e ação desenvolvido pela Buena Vista Interactive e publicado em 1995 para o Mega Drive, baseado na série animada da Disney. Você controla Goliath, o líder dos gárgulas que despertam em Nova York e defendem a cidade do empresário Xanatos e de seus aliados. O personagem salta, plana e escala paredes, além de atacar com garras e a cauda. Os cenários passam por castelos e pelos telhados da metrópole, com visual sombrio e fiel ao desenho.","s":["Gargoyles (USA).shot.1.png","Gargoyles (USA).shot.2.png"]},{"n":"Jungle Book","c":"P","d":"Virgin Games","y":1994,"h":2.0,"f":"Jungle Book, The (USA).cover.png","t":"Jungle Book é um jogo de plataforma desenvolvido e publicado pela Virgin Games em 1994 para o Mega Drive, baseado no filme da Disney. Você controla Mogli pelas selvas da Índia, encontrando personagens como Baloo, Bagheera, Kaa, o Rei Louie e o tigre Shere Khan. O jogador salta, balança em cipós e usa bananas e outros projéteis para enfrentar os inimigos. Os cenários são ricos em detalhes e a trilha musical remete ao filme. O jogo é conhecido pelo alto nível de dificuldade.","s":["Jungle Book, The (USA).shot.1.png","Jungle Book, The (USA).shot.2.png"]},{"n":"Kid Chameleon","c":"P","d":"Sega Technical Institute","y":1992,"h":4.0,"f":"Kid Chameleon (USA, Europe).cover.png","t":"Kid Chameleon é um jogo de plataforma desenvolvido pela Sega Technical Institute e publicado pela Sega em 1992 para o Mega Drive. O jovem Casey fica preso em um jogo de realidade virtual controlado pelo vilão Heady Metal e transforma-se em Kid Chameleon para escapar. Ele ganha poderes ao encontrar máscaras, como a do cavaleiro que escala paredes ou a do samurai que usa uma espada. O jogo tem mais de cem fases, com muitos caminhos secretos e teletransportes. É extenso e desafiador, e a trilha sonora ajuda a manter o ritmo.","s":["Kid Chameleon (USA, Europe).shot.1.png","Kid Chameleon (USA, Europe).shot.2.png"]},{"n":"Mega Man: The Wily Wars","c":"P","d":"Capcom","y":1994,"h":3.0,"f":"Mega Man - The Wily Wars (Europe).cover.png","t":"Mega Man: The Wily Wars é uma coletânea de ação e plataforma desenvolvida e publicada pela Capcom em 1994 para o Mega Drive. O cartucho reúne remakes em 16 bits de Mega Man 1, 2 e 3, originalmente lançados para o NES, além de um modo inédito chamado Wily Tower, onde o jogador monta seu próprio caminho com chefes de várias fases. Mega Man enfrenta os robôs do Dr. Wily, adquirindo as armas dos chefes derrotados. Os gráficos e a trilha foram refeitos, e o jogo ganhou fama como exclusivo do console da Sega.","s":["Mega Man - The Wily Wars (Europe).shot.1.png","Mega Man - The Wily Wars (Europe).shot.2.png"]},{"n":"Mickey Mania","c":"P","d":"Traveller’s Tales","y":1994,"h":2.5,"f":null,"t":"Mickey Mania é um jogo de plataforma desenvolvido pela Traveller’s Tales e publicado em 1994 para o Mega Drive. A trama celebra os desenhos clássicos de Mickey, levando o jogador a reviver cenários de cartoons famosos, como Steamboat Willie, The Mad Doctor e Moose Hunters. O visual muda conforme a época do desenho, começando em preto e branco e passando a cores. Mickey ataca arremessando bolinhas de gude e salta sobre inimigos. O jogo é elogiado pela variedade de fases e pelas animações cuidadosas.","s":[]},{"n":"Monster World IV","c":"P","d":"Westone","y":1994,"h":5.0,"f":null,"t":"Monster World IV é um jogo de ação e aventura com elementos de RPG desenvolvido pela Westone e lançado em 1994 para o Mega Drive, inicialmente apenas no Japão. A heroína Asha, uma jovem guerreira de um mundo de ambientação árabe, parte para salvar espíritos aprisionados, acompanhada do pequeno Pepelogoo. O jogo mistura plataforma, exploração e combate com espada, com cidades, masmorras e itens de vida. Ele se destaca pelo visual colorido e pela atmosfera de contos orientais, e foi relançado em coletâneas modernas.","s":[]},{"n":"Pulseman","c":"P","d":"Game Freak","y":1994,"h":2.5,"f":null,"t":"Pulseman é um jogo de plataforma e ação desenvolvido pela Game Freak, estúdio que mais tarde criaria Pokémon, e publicado pela Sega em 1994 para o Mega Drive. O herói é um ser metade humano, metade programa de computador, criado pelo cientista Dr. Yoshiyama, que enfrenta ameaças ligadas a uma rede digital. Ele corre em alta velocidade e usa a eletricidade para atacar e dar saltos. A trilha foi composta por Junichi Masuda, que depois trabalharia em Pokémon, e o jogo tem estilo visual vibrante.","s":[]},{"n":"Ristar","c":"P","d":"Sonic Team","y":1995,"h":2.0,"f":"Ristar (USA, Europe).cover.png","t":"Ristar é um jogo de plataforma desenvolvido pela Sonic Team e publicado pela Sega em 1995 para o Mega Drive. O herói Ristar, uma estrela que habita o Planeta Neamar, tenta salvar o mundo do vilão Kaiser Greedy. Em vez de pular em inimigos, ele usa os braços elásticos para agarrá-los, se lançar e escalar. O visual é colorido e detalhado, com chefes criativos, e o design do personagem foi feito por Naoto Ohshima, também criador de Sonic. A trilha sonora é calma e atmosférica.","s":["Ristar (USA, Europe).shot.1.png","Ristar (USA, Europe).shot.2.png"]},{"n":"Sonic & Knuckles","c":"P","d":"Sonic Team","y":1994,"h":2.5,"f":"Sonic & Knuckles (World).cover.png","t":"Sonic & Knuckles é um jogo de plataforma desenvolvido pela Sonic Team e pela Sega Technical Institute, e publicado pela Sega em 1994 para o Mega Drive. A história continua a de Sonic 3, com o Dr. Robotnik tentando reerguer sua base, a Death Egg, e Knuckles enfrentando o ouriço. É possível jogar com Sonic, que ganha habilidades novas, ou com Knuckles, que plana e escala paredes. O cartucho tem a tecnologia lock-on, que permite conectar outros jogos da série e liberar conteúdo extra.","s":["Sonic & Knuckles (World).shot.1.png","Sonic & Knuckles (World).shot.2.png"]},{"n":"Sonic the Hedgehog","c":"P","d":"Sonic Team","y":1991,"h":1.5,"f":"Sonic The Hedgehog (USA, Europe).cover.png","t":"Sonic the Hedgehog é um jogo de plataforma desenvolvido pela Sonic Team e publicado pela Sega em 1991 para o Mega Drive. Criado por Yuji Naka, Naoto Ohshima e Hirokazu Yasuhara, ele apresenta o ouriço Sonic, que corre pelas fases coletando anéis e enfrentando o Dr. Robotnik para libertar seus amigos animais. A jogabilidade combina velocidade, saltos e loops, com fases como Green Hill Zone. A trilha foi composta por Masato Nakamura e o jogo ajudou a consolidar o console no mercado.","s":["Sonic The Hedgehog (USA, Europe).shot.1.png","Sonic The Hedgehog (USA, Europe).shot.2.png"]},{"n":"Sonic the Hedgehog 2","c":"P","d":"Sonic Team","y":1992,"h":2.0,"f":"Sonic The Hedgehog 2 (World).cover.png","t":"Sonic the Hedgehog 2 é um jogo de plataforma desenvolvido pela Sega Technical Institute e pela Sonic Team, e publicado pela Sega em 1992 para o Mega Drive. Sonic parte para impedir o Dr. Robotnik e ganha a companhia de Tails, controlado por um segundo jogador ou pelo computador. O jogo introduz o spin dash, que permite acelerar parado, e fases como Chemical Plant Zone e Emerald Hill Zone. Há também modo versus em tela dividida e fases especiais para reunir esmeraldas.","s":["Sonic The Hedgehog 2 (World).shot.1.png","Sonic The Hedgehog 2 (World).shot.2.png"]},{"n":"Sonic the Hedgehog 3","c":"P","d":"Sonic Team","y":1994,"h":2.5,"f":"Sonic The Hedgehog 3 (USA).cover.png","t":"Sonic the Hedgehog 3 é um jogo de plataforma desenvolvido pela Sonic Team e pela Sega Technical Institute, e publicado pela Sega em 1994 para o Mega Drive. A aventura se passa na Angel Island, onde Sonic e Tails encontram o equidna Knuckles, que atrapalha o caminho. Há escudos elementais com poderes diferentes, fases especiais e sistema de salvamento por bateria. O jogo é mais longo e elaborado que os anteriores e continua na história de Sonic & Knuckles.","s":["Sonic The Hedgehog 3 (USA).shot.1.png","Sonic The Hedgehog 3 (USA).shot.2.png"]},{"n":"Sparkster","c":"P","d":"Konami","y":1994,"h":2.0,"f":"Sparkster (USA).cover.png","t":"Sparkster é um jogo de ação e plataforma desenvolvido e publicado pela Konami em 1994 para o Mega Drive, sequência de Rocket Knight Adventures. O gambá-cavaleiro Sparkster enfrenta novamente o exército de porcos e Axel Gear, agora com golpes e habilidades ampliados. Ele usa espada e jetpack para atravessar fases com plataformas e trechos de voo, e o ritmo é rápido. O jogo é conhecido pelo bom visual e jogabilidade apurada, e é diferente do Sparkster lançado para outro console.","s":["Sparkster (USA).shot.1.png","Sparkster (USA).shot.2.png"]},{"n":"The Lion King","c":"P","d":"Westwood Studios","y":1994,"h":2.0,"f":"Lion King, The (World).cover.png","t":"The Lion King é um jogo de plataforma desenvolvido pela Westwood Studios, depois conhecida por Command & Conquer, e publicado pela Virgin Interactive em 1994 para o Mega Drive, baseado no filme da Disney. O jogador controla Simba, primeiro filhote e depois adulto, em fases que seguem passagens da história, como a savana, a fuga e a batalha final contra Scar. Simba pula, ruge para atordoar inimigos e usa golpes de garra. Os gráficos têm animações bonitas e o jogo é considerado difícil.","s":["Lion King, The (World).shot.1.png","Lion King, The (World).shot.2.png"]},{"n":"Tiny Toon Adventures: Buster’s Hidden Treasure","c":"P","d":"Konami","y":1993,"h":1.5,"f":"Tiny Toon Adventures - Buster's Hidden Treasure (USA).cover.png","t":"Tiny Toon Adventures: Buster’s Hidden Treasure é um jogo de plataforma desenvolvido e publicado pela Konami em 1993 para o Mega Drive, baseado na série animada. Buster Bunny parte atrás do tesouro e enfrenta Montana Max e outros vilões. O jogo permite alternar entre Buster e outros personagens da turma e tem fases coloridas e cheias de humor. Os cenários são variados e as animações lembram o desenho.","s":["Tiny Toon Adventures - Buster's Hidden Treasure (USA).shot.1.png","Tiny Toon Adventures - Buster's Hidden Treasure (USA).shot.2.png"]},{"n":"Toki: Going Ape Spit","c":"P","d":"TAD / Sage’s Creation","y":1993,"h":1.0,"f":"Toki - Going Ape Spit (World).cover.png","t":"Toki: Going Ape Spit é um jogo de plataforma desenvolvido pela TAD Corporation e adaptado para o Mega Drive pela Sage’s Creation em 1993, a partir do fliperama de 1989. Toki é um herói transformado em macaco pelo feiticeiro Vookimedlo, que também sequestrou sua namorada, Miho. Ele cospe projéteis e pode melhorar a arma com itens coletados. As fases passam por selvas, cavernas e outros cenários, e o jogo é conhecido pela dificuldade e por seu humor.","s":[]},{"n":"Vectorman","c":"P","d":"BlueSky Software","y":1995,"h":3.0,"f":"Vectorman (USA, Europe).cover.png","t":"Vectorman é um jogo de ação e plataforma desenvolvido pela BlueSky Software e publicado pela Sega em 1995 para o Mega Drive. A história se passa em uma Terra deserta, quando o robô de limpeza Vectorman luta contra o robô Raster e seu exército. Os gráficos usam modelos pré-renderizados em 3D, com animações fluidas, e o personagem atira em várias direções e se transforma com power-ups. O jogo é elogiado pelo visual e pela trilha eletrônica.","s":["Vectorman (USA, Europe).shot.1.png","Vectorman (USA, Europe).shot.2.png"]},{"n":"Wonder Boy in Monster World","c":"P","d":"Westone","y":1991,"h":4.0,"f":"Wonder Boy in Monster World (USA, Europe).cover.png","t":"Wonder Boy in Monster World é um jogo de plataforma com elementos de RPG desenvolvido pela Westone e publicado pela Sega em 1991 para o Mega Drive. O herói Shion viaja por vilas e masmorras em busca de vencer um dragão, comprando equipamentos e melhorando sua espada. A jogabilidade mistura exploração, itens e combate, com a companhia do pequeno Pururun. É o terceiro episódio da série Monster World, com visual colorido e clima aventureiro.","s":["Wonder Boy in Monster World (USA, Europe).shot.1.png","Wonder Boy in Monster World (USA, Europe).shot.2.png"]},{"n":"World of Illusion Starring Mickey Mouse and Donald Duck","c":"P","d":"Sega","y":1992,"h":1.5,"f":null,"t":"World of Illusion Starring Mickey Mouse and Donald Duck é um jogo de plataforma desenvolvido e publicado pela Sega em 1992 para o Mega Drive. Mickey e Donald entram em uma caixa mágica do mágico Illusion e vivem aventuras em mundos diferentes. O jogo tem cooperativo para dois jogadores, com fases e estilos distintos para cada personagem. O visual é detalhado, com animações cuidadosas, e é considerado sucessor de Castle of Illusion.","s":[]},{"n":"Beyond Oasis (The Story of Thor)","c":"R","d":"Ancient / Sega","y":1994,"h":7.0,"f":"Beyond Oasis (USA).cover.png","t":"Beyond Oasis é um jogo de ação e aventura desenvolvido pela Ancient e publicado pela Sega em 1994 para o Mega Drive. A empresa foi fundada por Yuzo Koshiro e sua mãe, Tomoko. O jogador controla o príncipe Ali, que encontra um bracelete dourado e deve evitar que o vilão Agito use um bracelete rival. O príncipe luta com uma adaga e pode invocar espíritos elementais, como Efreet, Dytto e Shade, que dão poderes extras. O jogo é lembrado pelos gráficos detalhados e pela trilha, também de Koshiro.","s":["Beyond Oasis (USA).shot.1.png","Beyond Oasis (USA).shot.2.png"]},{"n":"Crusader of Centy (Soleil)","c":"R","d":"Nextech / Sega","y":1994,"h":10.0,"f":"Crusader of Centy (USA).cover.png","t":"Crusader of Centy é um jogo de ação e aventura com elementos de RPG desenvolvido pela Nextech e publicado pela Sega em 1994 para o Mega Drive, lançado como Soleil na Europa. O jovem protagonista ganha a habilidade de entender os animais, e seus novos amigos o ajudam a enfrentar monstros e resolver quebra-cabeças. A jogabilidade lembra a de The Legend of Zelda, com exploração e combate com espada. O jogo se destaca pela originalidade e pela história cheia de pequenos acontecimentos.","s":["Crusader of Centy (USA).shot.1.png","Crusader of Centy (USA).shot.2.png"]},{"n":"Dune II: Battle for Arrakis","c":"R","d":"Westwood Studios","y":1993,"h":10.0,"f":"Dune - The Battle For Arrakis (USA).cover.png","t":"Dune II: Battle for Arrakis é um jogo de estratégia em tempo real desenvolvido pela Westwood Studios e lançado para computadores em 1992, com versão para o Mega Drive publicada em 1993. Inspirado no universo de Duna, o jogador comanda uma das casas, como Atreides, Harkonnen ou Ordos, na disputa pelo controle da especiaria em Arrakis. É preciso coletar recursos, construir bases e treinar unidades. O jogo ajudou a definir o gênero RTS, e a versão do console adapta os controles ao joystick.","s":["Dune - The Battle for Arrakis (USA).shot.1.png","Dune - The Battle for Arrakis (USA).shot.2.png"]},{"n":"Gauntlet IV","c":"R","d":"Tengen","y":1993,"h":3.0,"f":"Gauntlet IV (USA, Europe).cover.png","t":"Gauntlet IV é um jogo de ação com exploração de masmorras publicado pela Tengen em 1993 para o Mega Drive, baseado na série de fliperama da Atari Games. O jogador escolhe entre guerreiro, valquíria, mago e elfo e atravessa labirintos enfrentando monstros e coletando tesouros. Há modos arcade, aventura e batalha, com suporte para até quatro jogadores com adaptador. O jogo é conhecido pela ação cooperativa e pelo estilo de jogo simples e viciante.","s":["Gauntlet IV (USA, Europe).shot.1.png","Gauntlet IV (USA, Europe).shot.2.png"]},{"n":"Herzog Zwei","c":"R","d":"Technosoft","y":1989,"h":3.0,"f":"Herzog Zwei (USA, Europe).cover.png","t":"Herzog Zwei é um jogo de estratégia em tempo real desenvolvido e publicado pela Technosoft em 1989 para o Mega Drive. O jogador controla um robô transformável que voa pelo campo, dá ordens e carrega unidades para o combate, em disputa com o exército rival. O objetivo é destruir a base inimiga, e o jogo pode ser disputado por dois jogadores em tela dividida. É considerado precursor do gênero de estratégia em tempo real, e a Technosoft também criou Thunder Force.","s":["Herzog Zwei (USA, Europe).shot.1.png","Herzog Zwei (USA, Europe).shot.2.png"]},{"n":"Landstalker","c":"R","d":"Climax Entertainment","y":1993,"h":12.0,"f":"Landstalker (USA).cover.png","t":"Landstalker é um jogo de ação e RPG desenvolvido pela Climax Entertainment e publicado pela Sega em 1993 para o Mega Drive. Você controla Nigel, um caçador de tesouros que parte em busca do tesouro do rei Nole, acompanhado da fada Friday. A perspectiva é isométrica, e a jogabilidade combina combate, plataforma e quebra-cabeças, com muitas passagens secretas e itens. O mundo é grande e o jogo se destaca pelo humor e pela exploração.","s":["Landstalker (USA).shot.1.png","Landstalker (USA).shot.2.png"]},{"n":"Light Crusader","c":"R","d":"Treasure","y":1995,"h":10.0,"f":"Light Crusader (USA).cover.png","t":"Light Crusader é um jogo de ação e RPG desenvolvido pela Treasure e publicado pela Sega em 1995 para o Mega Drive. O cavaleiro Sir David chega à vila de Green Row para investigar desaparecimentos e acaba explorando masmorras cheias de monstros. A visão é isométrica e a jogabilidade mistura combate, quebra-cabeças e exploração. Foi um raro projeto de RPG da Treasure, conhecida por jogos de ação, com gráficos detalhados e trilha sonora atmosférica.","s":["Light Crusader (USA).shot.1.png","Light Crusader (USA).shot.2.png"]},{"n":"Phantasy Star II","c":"R","d":"Sega","y":1989,"h":20.0,"f":"Phantasy Star II (USA, Europe).cover.png","t":"Phantasy Star II é um RPG de ficção científica desenvolvido e publicado pela Sega em 1989 para o Mega Drive. A história se passa no sistema Algol, onde Rolf, um agente do governo, investiga monstros biológicos e uma crise que ameaça o planeta Mota. Ele reúne companheiros como Nei e Rudo e atravessa cidades e vastas masmorras. O combate é por turnos, e a aventura tem uma narrativa madura para a época. Foi um marco no gênero e um dos primeiros grandes RPGs do console.","s":["Phantasy Star II (USA, Europe).shot.1.png","Phantasy Star II (USA, Europe).shot.2.png"]},{"n":"Phantasy Star III: Generations of Doom","c":"R","d":"Sega","y":1990,"h":15.0,"f":"Phantasy Star III - Generations of Doom (USA, Europe).cover.png","t":"Phantasy Star III: Generations of Doom é um RPG por turnos desenvolvido e publicado pela Sega em 1990 para o Mega Drive. A história cobre três gerações de heróis, e as escolhas do jogador, como o casamento, definem a linhagem e o final. O jogo se passa em um mundo em guerra entre dois reinos e tem visual mais colorido que o do anterior. A trilha sonora é marcante e o jogo se destaca pela estrutura de gerações.","s":["Phantasy Star III - Generations of Doom (USA, Europe).shot.1.png","Phantasy Star III - Generations of Doom (USA, Europe).shot.2.png"]},{"n":"Phantasy Star IV","c":"R","d":"Sega","y":1993,"h":20.0,"f":"Phantasy Star IV (USA).cover.png","t":"Phantasy Star IV é um RPG por turnos desenvolvido e publicado pela Sega em 1993 para o Mega Drive, que encerra a saga clássica. Você acompanha o caçador Chaz Ashley e a veterana Alys Brangwin, em uma jornada pelos planetas Motavia, Dezolis e Algol contra a Força Sombria. As cenas de história são apresentadas em quadros de estilo mangá, e o sistema permite combos com macros de golpes. A trama é envolvente e o jogo é considerado um dos melhores RPGs do console.","s":["Phantasy Star IV (USA).shot.1.png","Phantasy Star IV (USA).shot.2.png"]},{"n":"Shadowrun","c":"R","d":"BlueSky Software","y":1994,"h":12.0,"f":"Shadowrun (USA).cover.png","t":"Shadowrun é um RPG de ação desenvolvido pela BlueSky Software e publicado em 1994 para o Mega Drive, baseado no RPG de mesa da FASA. O jogo é diferente da versão lançada para outro console. O protagonista Jake Armitage acorda sem memória e investiga a própria morte em uma Seattle cyberpunk de 2050. O jogador usa armas, magia, hacking e conversa com personagens para avançar. O visual é sombrio e a ambientação mistura tecnologia e fantasia.","s":["Shadowrun (USA).shot.1.png","Shadowrun (USA).shot.2.png"]},{"n":"Shining Force","c":"R","d":"Climax / Sonic! Software Planning","y":1992,"h":20.0,"f":"Shining Force (USA).cover.png","t":"Shining Force é um RPG tático desenvolvido pela Climax Entertainment em parceria com a Sonic! Software Planning e publicado pela Sega em 1992 para o Mega Drive. O jovem Max lidera o grupo Shining Force contra o exército de Runefaust, em batalhas por turnos em grade e um mapa para visitar cidades. O jogador recruta aliados, equipa personagens e melhora seus níveis. Foi um dos jogos de estratégia mais populares do console, com personagens carismáticos.","s":["Shining Force (USA).shot.1.png","Shining Force (USA).shot.2.png"]},{"n":"Shining Force II","c":"R","d":"Sonic! Software Planning","y":1993,"h":25.0,"f":"Shining Force II (USA).cover.png","t":"Shining Force II é um RPG tático desenvolvido pela Sonic! Software Planning e publicado pela Sega em 1993 para o Mega Drive. A aventura é maior que a do primeiro jogo, com um mundo mais amplo e batalhas mais variadas. Você lidera um grupo por regiões e cidades, enfrentando inimigos por turnos em grade, enquanto recruta novos aliados. O jogo tem mais personagens e é muito apreciado pela profundidade tática e pela trilha sonora.","s":["Shining Force II (USA).shot.1.png","Shining Force II (USA).shot.2.png"]},{"n":"Shining in the Darkness","c":"R","d":"Climax / Sonic! Software Planning","y":1991,"h":15.0,"f":"Shining in the Darkness (USA, Europe).cover.png","t":"Shining in the Darkness é um RPG de masmorra desenvolvido pela Climax Entertainment e pela Sonic! Software Planning e publicado pela Sega em 1991 para o Mega Drive, o primeiro da série Shining. O herói é filho de um cavaleiro desaparecido e parte para resgatar a princesa e o pai das garras do Dark Sol. A exploração é em primeira pessoa, em labirintos cheios de monstros e armadilhas, com combate por turnos. É conhecido pela atmosfera e pelo grande desafio.","s":["Shining in the Darkness (USA, Europe).shot.1.png","Shining in the Darkness (USA, Europe).shot.2.png"]},{"n":"The Immortal","c":"R","d":"Sandcastle / EA","y":1991,"h":4.0,"f":"Immortal, The (USA, Europe).cover.png","t":"The Immortal é um jogo de aventura e ação em masmorras desenvolvido pela Sandcastle e publicado pela Electronic Arts em 1991 para o Mega Drive, a partir da versão para computador de 1990. Você controla um mago que entra em uma masmorra para encontrar seu antigo mestre, enfrentando monstros e armadilhas. A visão é isométrica e o combate é bastante violento para a época. O jogo é difícil e se destaca por sua ambientação sombria.","s":["Immortal, The (USA, Europe).shot.1.png","Immortal, The (USA, Europe).shot.2.png"]},{"n":"The Lost Vikings","c":"R","d":"Silicon & Synapse","y":1994,"h":3.0,"f":"Lost Vikings, The (USA).cover.png","t":"The Lost Vikings é um jogo de plataforma e quebra-cabeça desenvolvido pela Silicon & Synapse, estúdio que depois se tornaria a Blizzard, e publicado pela Interplay, com versão para o Mega Drive em 1994. Os vikings Erik, Baleog e Olaf são capturados pelo alienígena Tomator e precisam trabalhar juntos para voltar para casa. Cada um tem uma habilidade, e o jogador alterna entre eles para superar obstáculos. A mecânica é inteligente e o humor é um dos atrativos.","s":["Lost Vikings, The (USA).shot.1.png","Lost Vikings, The (USA).shot.2.png"]},{"n":"Warsong (Langrisser)","c":"R","d":"Masaya / NCS","y":1991,"h":10.0,"f":"Warsong (USA).cover.png","t":"Warsong é a versão ocidental de Langrisser, um RPG de estratégia desenvolvido pela Masaya e lançado em 1991 para o Mega Drive. O jogador controla o jovem Ledin e um exército, enfrentando tropas inimigas em batalhas por turnos, com comandantes que lideram mercenários. A série Langrisser tem longa história no Japão. O jogo é lembrado pelo equilíbrio entre estratégia e narrativa de fantasia.","s":["Warsong (USA).shot.1.png","Warsong (USA).shot.2.png"]},{"n":"Eternal Champions","c":"L","d":"Sega","y":1993,"h":2.0,"f":"Eternal Champions (USA).cover.png","t":"Eternal Champions é um jogo de luta desenvolvido e publicado pela Sega em 1993 para o Mega Drive. Dez lutadores de épocas diferentes, resgatados no momento da morte pelo Eternal Champion, disputam um torneio para voltar à vida. Cada personagem tem golpes especiais e o jogo traz cenários com armadilhas e golpes de finalização chamados Overkills. A jogabilidade é técnica e o visual é detalhado.","s":["Eternal Champions (USA).shot.1.png","Eternal Champions (USA).shot.2.png"]},{"n":"Mortal Kombat","c":"L","d":"Probe / Acclaim","y":1993,"h":1.0,"f":"Mortal Kombat (World).cover.png","t":"Mortal Kombat é um jogo de luta com gráficos digitalizados criado por Ed Boon e John Tobias na Midway, com versão para o Mega Drive desenvolvida pela Probe Entertainment e publicada pela Acclaim em 1993. Lutadores como Liu Kang, Sub-Zero e Scorpion participam de um torneio organizado pelo feiticeiro Shang Tsung. O jogo é famoso pelos fatalities, golpes de finalização violentos, e a versão do console precisava de um código para liberar o sangue. A sua violência gerou polêmica.","s":["Mortal Kombat (World).shot.1.png","Mortal Kombat (World).shot.2.png"]},{"n":"Mortal Kombat II","c":"L","d":"Probe / Acclaim","y":1994,"h":1.0,"f":"Mortal Kombat II (World).cover.png","t":"Mortal Kombat II é um jogo de luta com gráficos digitalizados criado pela Midway, com versão para o Mega Drive desenvolvida pela Probe Entertainment e publicada pela Acclaim em 1994. O torneio acontece no Outworld, sob comando do imperador Shao Kahn, e o elenco ganha lutadores como Kitana, Mileena, Jax, Kung Lao e Baraka. O jogo traz mais fatalities, novos cenários e jogabilidade mais refinada. É um dos mais populares da série.","s":["Mortal Kombat II (World).shot.1.png","Mortal Kombat II (World).shot.2.png"]},{"n":"Street Fighter II: Special Champion Edition","c":"L","d":"Capcom","y":1993,"h":1.0,"f":"Street Fighter II' - Special Champion Edition (USA).cover.png","t":"Street Fighter II: Special Champion Edition é um jogo de luta desenvolvido e publicado pela Capcom em 1993 para o Mega Drive. Ele traz os doze lutadores do jogo original, incluindo os quatro chefes jogáveis, e permite duelos com o mesmo personagem. Entre os lutadores estão Ryu, Ken, Chun-Li e Guile. A jogabilidade é fiel ao arcade, e o cartucho tem opção de ajustar a velocidade.","s":["Street Fighter II' - Special Champion Edition (USA).shot.1.png","Street Fighter II' - Special Champion Edition (USA).shot.2.png"]},{"n":"Super Street Fighter II","c":"L","d":"Capcom","y":1994,"h":1.0,"f":"Super Street Fighter II - The New Challengers (USA).cover.png","t":"Super Street Fighter II é um jogo de luta desenvolvido e publicado pela Capcom em 1994 para o Mega Drive, adaptação do fliperama. Quatro novos lutadores, Cammy, Fei Long, Dee Jay e T. Hawk, juntam-se ao elenco, e o jogo traz cenários e golpes novos, e mais velocidade. É conhecido por um elenco de 16 personagens e por manter a precisão dos comandos na adaptação para o console.","s":["Super Street Fighter II - The New Challengers (USA).shot.1.png","Super Street Fighter II - The New Challengers (USA).shot.2.png"]},{"n":"Ultimate Mortal Kombat 3","c":"L","d":"Williams / Midway","y":1996,"h":1.0,"f":"Ultimate Mortal Kombat 3 (USA).cover.png","t":"Ultimate Mortal Kombat 3 é um jogo de luta desenvolvido pela Williams e publicado pela Midway em 1996 para o Mega Drive. A trama gira em torno da invasão da Terra por Shao Kahn, e o jogo traz 23 lutadores, incluindo personagens que haviam ficado de fora de Mortal Kombat 3. Há também novos modos, arenas e golpes de finalização. É uma versão ampliada do terceiro título da série.","s":["Ultimate Mortal Kombat 3 (USA).shot.1.png","Ultimate Mortal Kombat 3 (USA).shot.2.png"]},{"n":"Ayrton Senna’s Super Monaco GP II","c":"C","d":"Sega","y":1992,"h":5.0,"f":"Ayrton Senna's Super Monaco GP II (USA).cover.png","t":"Ayrton Senna’s Super Monaco GP II é um jogo de corrida desenvolvido e publicado pela Sega em 1992 para o Mega Drive, com licença do piloto brasileiro. O jogador participa de uma temporada de Fórmula 1, ajustando o carro, comprando peças e recebendo dicas de Senna. Há modo carreira com equipes e circuitos. O jogo é conhecido pela simulação mais profunda que a de outros jogos de corrida da época.","s":["Ayrton Senna's Super Monaco GP II (USA).shot.1.png","Ayrton Senna's Super Monaco GP II (USA).shot.2.png"]},{"n":"Micro Machines","c":"C","d":"Codemasters","y":1993,"h":3.0,"f":"Micro Machines (USA, Europe).cover.png","t":"Micro Machines é um jogo de corrida desenvolvido e publicado pela Codemasters em 1993 para o Mega Drive, baseado na linha de carrinhos de brinquedo. As pistas passam por locais do dia a dia, como mesas de café da manhã, bancadas e mesas de bilhar, vistas de cima. A jogabilidade é rápida e simples, com modo para dois jogadores. O jogo se destaca pelo humor e pela criatividade dos cenários.","s":["Micro Machines (USA, Europe).shot.1.png","Micro Machines (USA, Europe).shot.2.png"]},{"n":"Micro Machines 2: Turbo Tournament","c":"C","d":"Codemasters","y":1994,"h":4.0,"f":"Micro Machines 2 - Turbo Tournament (Europe).cover.png","t":"Micro Machines 2: Turbo Tournament é um jogo de corrida desenvolvido e publicado pela Codemasters em 1994 para o Mega Drive. Foi o primeiro cartucho com a tecnologia J-Cart, que traz portas de controle no próprio cartucho e permite mais jogadores. O jogo tem mais pistas, veículos e modos, incluindo torneios. A jogabilidade é parecida com a do primeiro jogo, mas com mais variedade.","s":["Micro Machines 2 - Turbo Tournament (Europe).shot.1.png","Micro Machines 2 - Turbo Tournament (Europe).shot.2.png"]},{"n":"OutRun","c":"C","d":"Sega","y":1991,"h":0.5,"f":"OutRun (USA, Europe).cover.png","t":"OutRun é um jogo de corrida publicado pela Sega em 1991 para o Mega Drive, adaptação do fliperama de 1986 criado por Yu Suzuki. O jogador dirige uma Ferrari Testarossa por estradas, e escolhe caminhos diferentes em bifurcações. A música, escolhida pelo jogador entre faixas como Magical Sound Shower, é uma das marcas do jogo. A versão do console perde alguns detalhes do arcade, mas mantém a sensação de passeio.","s":["OutRun (USA, Europe).shot.1.png","OutRun (USA, Europe).shot.2.png"]},{"n":"Road Rash II","c":"C","d":"Electronic Arts","y":1992,"h":3.0,"f":"Road Rash II (USA, Europe).cover.png","t":"Road Rash II é um jogo de corrida de moto desenvolvido e publicado pela Electronic Arts em 1992 para o Mega Drive. As corridas misturam velocidade e combate, e o jogador pode atacar os rivais com socos e armas. Esta sequência inclui nitro e modo para dois jogadores em tela dividida. O jogo é conhecido pelo humor e pela mistura de risco e ação.","s":["Road Rash II (USA, Europe).shot.1.png","Road Rash II (USA, Europe).shot.2.png"]},{"n":"Road Rash 3","c":"C","d":"Electronic Arts","y":1995,"h":4.0,"f":"Road Rash 3 (USA, Europe).cover.png","t":"Road Rash 3 é um jogo de corrida de moto e combate desenvolvido e publicado pela Electronic Arts em 1995 para o Mega Drive. O jogador percorre vários países em corridas ilegais, enfrentando rivais e a polícia, com opção de bater nos adversários. A sequência traz mais motos, melhorias e armas, além de um modo para dois jogadores. O visual é mais detalhado que o dos anteriores.","s":["Road Rash 3 (USA, Europe).shot.1.png","Road Rash 3 (USA, Europe).shot.2.png"]},{"n":"Rock n’ Roll Racing","c":"C","d":"Silicon & Synapse","y":1994,"h":3.0,"f":"Rock n' Roll Racing (USA).cover.png","t":"Rock n’ Roll Racing é um jogo de corrida com combate desenvolvido pela Silicon & Synapse e publicado pela Interplay em 1994 para o Mega Drive. As corridas acontecem em planetas diferentes, e os pilotos usam armas, minas e turbo. A trilha traz versões sintetizadas de clássicos do rock, e um locutor comenta a ação. Entre as corridas, o jogador melhora o carro e os equipamentos.","s":["Rock n' Roll Racing (USA).shot.1.png","Rock n' Roll Racing (USA).shot.2.png"]},{"n":"Super Hang-On","c":"C","d":"Sega","y":1989,"h":1.0,"f":"Super Hang-On (World).cover.png","t":"Super Hang-On é um jogo de corrida de moto publicado pela Sega em 1989 para o Mega Drive, adaptação do fliperama de 1987 da Sega AM2. O jogador acelera por circuitos de vários continentes, e tem os modos Arcade e Original, este com compra de melhorias. A jogabilidade é rápida e simples, com música ao estilo do fliperama. O jogo foi um dos primeiros do console.","s":["Super Hang-On (World).shot.1.png","Super Hang-On (World).shot.2.png"]},{"n":"Virtua Racing","c":"C","d":"Sega","y":1994,"h":1.0,"f":"Virtua Racing (USA).cover.png","t":"Virtua Racing é um jogo de corrida com gráficos poligonais em 3D publicado pela Sega em 1994 para o Mega Drive, a partir do fliperama de 1992 desenvolvido pela Sega AM2. O cartucho usa o chip SVP, que acelera o processamento e é exclusivo do jogo. O jogador corre em circuitos de Fórmula, com várias câmeras. O jogo é conhecido pela impressionante tecnologia, mas teve preço mais alto.","s":["Virtua Racing (USA).shot.1.png","Virtua Racing (USA).shot.2.png"]},{"n":"Bio-Hazard Battle","c":"S","d":"Sega","y":1992,"h":1.0,"f":"Bio Hazard Battle (USA, Europe).cover.png","t":"Bio-Hazard Battle é um shoot ’em up de rolagem horizontal desenvolvido e publicado pela Sega em 1992 para o Mega Drive, lançado no Japão como Crying. O jogador controla criaturas biomecânicas em um futuro pós-apocalíptico, enfrentando outras formas de vida em fases cheias de tentáculos e partes orgânicas. A ambientação é bizarra e o visual é bem diferente dos shooters da época. O jogo tem estilo único e trilha eletrônica.","s":["Bio Hazard Battle (USA, Europe).shot.1.png","Bio Hazard Battle (USA, Europe).shot.2.png"]},{"n":"Elemental Master","c":"S","d":"Technosoft","y":1990,"h":1.0,"f":"Elemental Master (USA).cover.png","t":"Elemental Master é um shoot ’em up desenvolvido e publicado pela Technosoft em 1990 para o Mega Drive. O jogador controla um mago e ataca em duas direções, para frente e para trás, usando magias de elementos como fogo e água. A fase tem chefes e cenários de fantasia, e a trilha sonora é marcante. O jogo é conhecido pela ambientação diferente do gênero.","s":["Elemental Master (USA).shot.1.png","Elemental Master (USA).shot.2.png"]},{"n":"Eliminate Down","c":"S","d":"Aprinet","y":1993,"h":1.0,"f":"Eliminate Down (Japan).cover.png","t":"Eliminate Down é um shoot ’em up de rolagem horizontal publicado pela Aprinet em 1993 para o Mega Drive. O jogador pilota uma nave por fases de ficção científica enfrentando ondas de inimigos e chefes. O jogo é pouco conhecido, mas tem ritmo intenso e visual colorido. Ele se destaca como uma peça menos comum da biblioteca do console.","s":["Eliminate Down (Japan).shot.1.png","Eliminate Down (Japan).shot.2.png"]},{"n":"Fire Shark","c":"S","d":"Toaplan","y":1990,"h":1.0,"f":"Fire Shark (USA).cover.png","t":"Fire Shark é um shoot ’em up de rolagem vertical desenvolvido pela Toaplan e publicado pela Sega em 1990 para o Mega Drive, adaptação do fliperama de 1989, lançado no Japão como Same! Same! Same!. O jogador controla um biplano, coleta power-ups e usa bombas para limpar a tela. A ação é rápida e há suporte para dois jogadores. O jogo é conhecido pela intensidade e pela dificuldade.","s":["Fire Shark (USA).shot.1.png","Fire Shark (USA).shot.2.png"]},{"n":"Forgotten Worlds","c":"S","d":"Capcom","y":1989,"h":1.0,"f":"Forgotten Worlds (World).cover.png","t":"Forgotten Worlds é um shoot ’em up desenvolvido pela Capcom e publicado em 1989 para o Mega Drive, adaptação do fliperama de 1988. Soldados voadores combatem os deuses do mal em um mundo em ruínas. Um módulo satélite acompanha o jogador e pode ser posicionado para atirar em várias direções. Entre fases há uma loja para comprar equipamentos com moeda coletada. O jogo é lembrado pelo estilo de ação.","s":["Forgotten Worlds (World).shot.1.png","Forgotten Worlds (World).shot.2.png"]},{"n":"Gaiares","c":"S","d":"Telenet Japan","y":1990,"h":1.0,"f":"Gaiares (Japan, USA).cover.png","t":"Gaiares é um shoot ’em up de rolagem horizontal desenvolvido e publicado pela Telenet Japan em 1990 para o Mega Drive. O jogador pilota uma nave com o sistema TOZ, que copia as armas dos inimigos para ganhar poderes novos. As fases são cheias de chefes enormes e a ação é veloz. O jogo é elogiado pela trilha e pelo visual.","s":["Gaiares (Japan, USA).shot.1.png","Gaiares (Japan, USA).shot.2.png"]},{"n":"Gley Lancer","c":"S","d":"Masaya / NCS","y":1992,"h":1.0,"f":"Advanced Busterhawk Gleylancer (Japan).cover.png","t":"Gley Lancer, lançado no Japão como Advanced Busterhawk Gley Lancer, é um shoot ’em up de rolagem horizontal desenvolvido pela Masaya e publicado pela NCS em 1992 para o Mega Drive. A piloto Lucia comanda uma nave e usa os Movers, módulos que acompanham a nave, em diferentes formações. A história tem estilo de anime e as fases são variadas. O jogo é reconhecido pela trilha e pelo visual.","s":["Advanced Busterhawk Gleylancer (Japan).shot.1.png","Advanced Busterhawk Gleylancer (Japan).shot.2.png"]},{"n":"Grind Stormer","c":"S","d":"Toaplan","y":1993,"h":1.0,"f":"Grind Stormer (USA).cover.png","t":"Grind Stormer é um shoot ’em up de rolagem vertical desenvolvido pela Toaplan em 1993 para o Mega Drive, lançado no Japão como V-Five. O jogador pilota uma nave e coleta power-ups, enfrentando chefes enormes. O jogo permite dois jogadores e tem ação intensa e muitas balas na tela. É lembrado pela dificuldade e pelo visual.","s":["Grind Stormer (USA).shot.1.png","Grind Stormer (USA).shot.2.png"]},{"n":"Hellfire","c":"S","d":"Toaplan","y":1990,"h":1.0,"f":"Hellfire (USA).cover.png","t":"Hellfire é um shoot ’em up de rolagem horizontal desenvolvido pela Toaplan e publicado em 1990 para o Mega Drive, adaptação do fliperama de 1989. A nave dispara em quatro direções, e o jogador alterna entre elas para enfrentar os inimigos. A ação é intensa e os cenários são espaciais. O jogo se destaca pela mecânica diferente.","s":["Hellfire (USA).shot.1.png","Hellfire (USA).shot.2.png"]},{"n":"MUSHA","c":"S","d":"Compile","y":1990,"h":1.0,"f":"MUSHA - Metallic Uniframe Super Hybrid Armor (USA).cover.png","t":"MUSHA, lançado no Japão como MUSHA Aleste, é um shoot ’em up de rolagem vertical desenvolvido pela Compile e publicado em 1990 para o Mega Drive. O jogador controla um robô armado com armas poderosas, e a sigla significa Metallic Uniframe Super Hybrid Armor. As fases têm cenários variados e chefes enormes, e a trilha é marcante. O jogo é parte da série Aleste.","s":["MUSHA - Metallic Uniframe Super Hybrid Armor (USA).shot.1.png","MUSHA - Metallic Uniframe Super Hybrid Armor (USA).shot.2.png"]},{"n":"Panorama Cotton","c":"S","d":"Success","y":1994,"h":1.0,"f":"Panorama Cotton (Japan).cover.png","t":"Panorama Cotton é um shoot ’em up de rolagem com efeito pseudo-3D desenvolvido e publicado pela Success em 1994 para o Mega Drive, lançado apenas no Japão. A bruxa Cotton voa em uma vassoura e enfrenta inimigos para conseguir doces chamados Willows. A ação acontece em um cenário que se aproxima do jogador, com muita velocidade. O jogo é lembrado pela fofura e pela dificuldade.","s":["Panorama Cotton (Japan).shot.1.png","Panorama Cotton (Japan).shot.2.png"]},{"n":"Ranger-X","c":"S","d":"Gau Entertainment / Sega","y":1993,"h":1.5,"f":"Ranger X (USA).cover.png","t":"Ranger-X é um jogo de ação e tiro desenvolvido pela Gau Entertainment e publicado pela Sega em 1993 para o Mega Drive. O jogador controla o robô Ex-Up, com apoio da moto Indra e do veículo de apoio, em fases que misturam tiro e plataforma. As armas são variadas e há chefes. O jogo tem visual detalhado e atmosfera de ficção científica.","s":["Ranger X (USA).shot.1.png","Ranger X (USA).shot.2.png"]},{"n":"Thunder Force III","c":"S","d":"Technosoft","y":1990,"h":1.0,"f":"Thunder Force III (Japan, USA).cover.png","t":"Thunder Force III é um shoot ’em up de rolagem horizontal desenvolvido e publicado pela Technosoft em 1990 para o Mega Drive. O jogador pilota a nave Fire Leo, que pode trocar de armas, e escolhe a ordem de algumas fases. A ação é veloz e a trilha sonora é marcante. O jogo é muito apreciado e ajudou a consolidar a série.","s":["Thunder Force III (Japan, USA).shot.1.png","Thunder Force III (Japan, USA).shot.2.png"]},{"n":"Thunder Force IV (Lightening Force)","c":"S","d":"Technosoft","y":1992,"h":1.5,"f":"Thunder Force IV (Europe).cover.png","t":"Thunder Force IV, lançado como Lightening Force no Ocidente, é um shoot ’em up de rolagem horizontal desenvolvido e publicado pela Technosoft em 1992 para o Mega Drive. O jogador pilota a nave Rynex e utiliza armas que podem ser trocadas, em fases muito variadas, incluindo cenários com rolagem em várias direções. O jogo é considerado referência do gênero, com visual impressionante e trilha sonora marcante.","s":["Thunder Force IV (Europe).shot.1.png","Thunder Force IV (Europe).shot.2.png"]},{"n":"Truxton","c":"S","d":"Toaplan","y":1991,"h":1.0,"f":"Truxton (World).cover.png","t":"Truxton é um shoot ’em up de rolagem vertical desenvolvido pela Toaplan e publicado pela Sega em 1991 para o Mega Drive, a partir do fliperama de 1988, lançado no Japão como Tatsujin. O jogador pilota a nave Super Fighter e usa bombas de caveira que limpam a tela. O jogo é muito difícil, mas com ação intensa e visual marcante.","s":["Truxton (World).shot.1.png","Truxton (World).shot.2.png"]},{"n":"Twinkle Tale","c":"S","d":"Westone","y":1992,"h":1.0,"f":null,"t":"Twinkle Tale é um shoot ’em up desenvolvido pela Westone, mesma criadora de Wonder Boy, e publicado em 1992 para o Mega Drive. Uma jovem maga enfrenta criaturas em um cenário de fantasia, atirando em várias direções. O jogo mistura ação e ambientação de contos de fadas, e foi lançado apenas no Japão. Tem visual colorido e trilha agradável.","s":[]},{"n":"V.V. (V-Five)","c":"S","d":"Toaplan","y":1993,"h":1.0,"f":null,"t":"V.V. (V-Five) é um shoot ’em up de rolagem vertical desenvolvido pela Toaplan e lançado em 1993 para o Mega Drive no Japão, conhecido no Ocidente como Grind Stormer. O jogador pilota uma nave e coleta power-ups para enfrentar inimigos e chefes. A ação é rápida e há suporte para dois jogadores. É um título importante para fãs de shoot ’em ups.","s":[]},{"n":"Verytex","c":"S","d":"Asmik","y":1992,"h":1.0,"f":"Verytex (Japan).cover.png","t":"Verytex é um shoot ’em up de rolagem horizontal publicado pela Asmik em 1992 para o Mega Drive, lançado apenas no Japão. O jogador pilota uma nave de ficção científica e enfrenta chefes enormes. Há sistema de armas e módulos de apoio. O jogo é pouco conhecido, mas aprecia-se pelo visual e pela trilha.","s":["Verytex (Japan).shot.1.png","Verytex (Japan).shot.2.png"]},{"n":"Columns","c":"E","d":"Sega","y":1990,"h":0.5,"f":"Columns (World).cover.png","t":"Columns é um jogo de quebra-cabeça publicado pela Sega em 1990 para o Mega Drive. Colunas de gemas coloridas caem na tela e o jogador precisa alinhá-las em linhas de três ou mais da mesma cor para eliminá-las. O jogo tem modos para um e dois jogadores e música marcante. É um dos principais títulos do gênero ao lado de Tetris.","s":["Columns (World).shot.1.png","Columns (World).shot.2.png"]},{"n":"Dr. Robotnik’s Mean Bean Machine","c":"E","d":"Compile / Sega","y":1993,"h":1.5,"f":"Dr. Robotnik's Mean Bean Machine (USA).cover.png","t":"Dr. Robotnik’s Mean Bean Machine é um jogo de quebra-cabeça desenvolvido pela Compile e publicado pela Sega em 1993 para o Mega Drive, baseado em Puyo Puyo, com personagens de Sonic. O jogador deve combinar feijões da mesma cor para eliminá-los e enviar blocos ao adversário. O modo história enfrenta os capangas de Robotnik. O jogo é viciante e tem modo para dois jogadores.","s":["Dr. Robotnik's Mean Bean Machine (USA).shot.1.png","Dr. Robotnik's Mean Bean Machine (USA).shot.2.png"]},{"n":"General Chaos","c":"E","d":"Game Refuge / EA","y":1994,"h":2.0,"f":"General Chaos (USA, Europe).cover.png","t":"General Chaos é um jogo de ação e estratégia desenvolvido pela Game Refuge e publicado pela Electronic Arts em 1994 para o Mega Drive. Dois exércitos de soldados caricatos se enfrentam em arenas, e o jogador controla um pequeno grupo com armas diferentes. A jogabilidade é rápida e há modo para dois jogadores. O humor é o destaque.","s":["General Chaos (USA, Europe).shot.1.png","General Chaos (USA, Europe).shot.2.png"]},{"n":"International Superstar Soccer Deluxe","c":"E","d":"Konami","y":1996,"h":5.0,"f":"International Superstar Soccer Deluxe (Europe).cover.png","t":"International Superstar Soccer Deluxe é um jogo de futebol desenvolvido e publicado pela Konami em 1996 para o Mega Drive. O jogo traz seleções nacionais e modos de torneio e amistoso, com jogabilidade realista e controle preciso. É um dos jogos de futebol mais apreciados do console.","s":["International Superstar Soccer Deluxe (Europe).shot.1.png","International Superstar Soccer Deluxe (Europe).shot.2.png"]},{"n":"Lemmings","c":"E","d":"DMA Design","y":1992,"h":8.0,"f":"Lemmings (Japan, USA).cover.png","t":"Lemmings é um jogo de quebra-cabeça desenvolvido pela DMA Design, mais tarde conhecida como Rockstar North, com lançamento original em 1991 e versão para o Mega Drive em 1992. O jogador guia lemingues por fases cheias de obstáculos atribuindo habilidades como cavar, construir e bloquear. É preciso salvar um número mínimo deles. O jogo tem centenas de fases e é considerado um clássico.","s":["Lemmings (Japan, USA).shot.1.png","Lemmings (Japan, USA).shot.2.png"]},{"n":"Mega Bomberman","c":"E","d":"Hudson Soft","y":1994,"h":3.0,"f":"Mega Bomberman (USA).cover.png","t":"Mega Bomberman é um jogo de ação e labirinto desenvolvido e publicado pela Hudson Soft em 1994 para o Mega Drive. O jogador planta bombas para eliminar adversários e abrir caminho, em modo história e em partidas para até quatro jogadores. É conhecido pelo multiplayer divertido e pela jogabilidade simples.","s":["Mega Bomberman (USA).shot.1.png","Mega Bomberman (USA).shot.2.png"]},{"n":"Mutant League Football","c":"E","d":"Electronic Arts","y":1993,"h":4.0,"f":"Mutant League Football (USA, Europe).cover.png","t":"Mutant League Football é um jogo de futebol americano desenvolvido e publicado pela Electronic Arts em 1993 para o M +'<select class="s" data-n="'+g.i+'" data-v="'+s+'">'+["Não joguei","Não terminado","Terminado","Abandonado"].map(function(o){return"<option"+(o==s?" selected":"")+">"+o+"</option>"}).join("")+'</select></div></article>'}
function render(){

render();msg("Backup restaurado: "+Object.keys(ns).length+" status, "+Object.keys(nc).length+" comentários e "+n+" capas trocadas.")};
r.readAsText(f)});
